name: Build Study Room Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare & Build Release APK
        run: |
          PUBSPEC_PATH=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml পাওয়া যায়নি! জিপ ফাইলের ভেতরের ফাইলগুলো Code ট্যাবে আপলোড করুন।"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          cd "$PROJECT_DIR"
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          fi
          if [ ! -f "android/gradlew" ]; then
            flutter create --platforms=android --org com.junaid.studyroom .
          fi
          if [ -f "/tmp/AndroidManifest.xml.bak" ]; then
            cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          fi
          flutter pub get
          flutter build apk --release
          mkdir -p "$GITHUB_WORKSPACE/apk_out"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/apk_out/Study-Room-Junaid.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Study-Room-Junaid-APK
          path: apk_out/Study-Room-Junaid.apk
